<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="assets/brent-bear.png" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>2026 Brent Elementary Christmas Tree and Holiday Sale</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="event-header">
      <img
        class="event-bear"
        src="assets/brent-bear.png"
        alt="Brent bear"
        width="90"
        height="50"
      />
      <div class="event-heading">
        <h1>2026 Brent Elementary Christmas Tree and Holiday Sale</h1>
      </div>
      <button id="mine">Find my signups</button>
    </header>
    <main class="volunteer-main">
      <section
        class="sheet volunteer-sheet"
        aria-label="Volunteer signup board"
      >
        <div class="toolbar">
          <div class="tabs" id="days" aria-label="Filter by day"></div>
          <div class="filters">
            <label class="check"
              ><input type="checkbox" id="need" /> Needs help only</label
            >
          </div>
        </div>
        <div class="sheet-caption">
          <span
            ><span class="lock">▣</span> View the board. Sign up through a form.
            Everyone else’s entries stay safe.</span
          >
        </div>
        <div class="table-wrap">
          <table>
            <caption class="sr">
              Volunteer shifts and signup counts
            </caption>
            <thead>
              <tr>
                <th class="number">#</th>
                <th>Day</th>
                <th>Job</th>
                <th>Time</th>
                <th>Signed up</th>
                <th><span class="sr">Sign up</span></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="sheet-bottom">
          <span
            ><i class="dot amber"></i> Help needed
            <i class="dot green"></i> Target reached</span
          >
        </div>
      </section>
    </main>
    <footer>
      <span>Organized by Brent PTA · © 2026</span>
    </footer>
    <dialog id="modal"></dialog>
    <div id="toast" role="status"></div>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
