name: Deploy AWS development

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - public/**
      - infra/app/**
      - scripts/**
      - .github/workflows/deploy-development.yml

permissions:
  contents: read

concurrency:
  group: tream-aws-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Reuse the configured trust environment; infrastructure itself is named tream-dev.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      PLAYWRIGHT_MODULE: /tmp/tream-browser/node_modules/playwright
      PLAYWRIGHT_BROWSERS_PATH: /tmp/tream-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tests
        run: |
          python3 -m unittest discover -s backend/tests -v
          node --check public/app.js
          node --check public/organizer.js
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: tream-development-deploy
          mask-aws-account-id: true
      - name: Terraform init, validate and plan
        working-directory: infra/app
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false -backend-config="bucket=tream-${account_id}-tfstate"
          terraform fmt -check
          terraform validate
          terraform plan -input=false -lock-timeout=120s -out=deployment.tfplan
      - name: Apply development infrastructure
        working-directory: infra/app
        run: terraform apply -input=false -lock-timeout=120s deployment.tfplan
      - name: Prepare application tooling
        run: |
          python3 -m venv /tmp/tream-deploy-venv
          /tmp/tream-deploy-venv/bin/pip install 'boto3>=1.35,<2'
          npm install --prefix /tmp/tream-browser --no-audit --no-fund playwright@1.56.1
          /tmp/tream-browser/node_modules/.bin/playwright install chromium --only-shell
      - name: Seed draft schedule and publish frontend
        run: |
          export TABLE_NAME="$(terraform -chdir=infra/app output -raw table_name)"
          export API_URL="$(terraform -chdir=infra/app output -raw api_url)"
          export SITE_URL="$(terraform -chdir=infra/app output -raw site_url)"
          export ORGANIZER_POOL_ID="$(terraform -chdir=infra/app output -raw organizer_pool_id)"
          export ORGANIZER_CLIENT_ID="$(terraform -chdir=infra/app output -raw organizer_client_id)"
          web_bucket="$(terraform -chdir=infra/app output -raw web_bucket)"
          distribution="$(terraform -chdir=infra/app output -raw distribution_id)"
          /tmp/tream-deploy-venv/bin/python scripts/seed_schedule.py
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('public/config.js').write_text('window.TREAM_CONFIG = '+json.dumps({'apiBase':os.environ['API_URL'],'organizerPoolId':os.environ['ORGANIZER_POOL_ID'],'organizerClientId':os.environ['ORGANIZER_CLIENT_ID'],'region':'us-east-2'})+';\n')
          PY
          aws s3 sync public/ "s3://${web_bucket}/" --delete --cache-control 'max-age=60'
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' --query Invalidation.Id --output text
          echo "SITE_URL=${SITE_URL}" >> "$GITHUB_ENV"
          echo "API_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "TABLE_NAME=${TABLE_NAME}" >> "$GITHUB_ENV"
          echo "ORGANIZER_POOL_ID=${ORGANIZER_POOL_ID}" >> "$GITHUB_ENV"
          echo "ORGANIZER_CLIENT_ID=${ORGANIZER_CLIENT_ID}" >> "$GITHUB_ENV"
          {
            echo '## Development deployment'
            echo "- Board: ${SITE_URL}"
            echo "- API: ${API_URL}"
            echo '- Shared development database; use sample details only. Email disabled.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise deployed API and clean up test data
        run: /tmp/tream-deploy-venv/bin/python scripts/smoke_aws.py
      - name: Exercise organizer authorization and operations
        run: /tmp/tream-deploy-venv/bin/python scripts/smoke_admin.py
      - name: Exercise public schedule policy rendering
        run: node scripts/browser_public_rules.cjs
      - name: API diagnostics after a failed deployment test
        if: ${{ failure() }}
        continue-on-error: true
        run: aws logs tail /aws/lambda/tream-dev-api --since 10m --format short
