name: Deploy AWS development

on:
  workflow_dispatch:
    inputs:
      launch_safe:
        description: Skip schedule migrations and production-mutating smoke tests; restrict Terraform updates
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - backend/**
      - public/**
      - infra/app/**
      - scripts/**
      - .github/workflows/deploy-development.yml

permissions:
  contents: read

concurrency:
  group: tream-aws-development
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip deploy]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Reuse the configured trust environment; infrastructure itself is named tream-dev.
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      LAUNCH_SAFE: ${{ inputs.launch_safe && 'true' || 'false' }}
      PLAYWRIGHT_MODULE: /tmp/tream-browser/node_modules/playwright
      PLAYWRIGHT_BROWSERS_PATH: /tmp/tream-playwright
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tests
        run: |
          python3 -m unittest discover -s backend/tests -v
          node --check public/app.js
          node --check public/organizer.js
          node --check public/manage.js
          node --test operations/test_request.cjs
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: tream-development-deploy
          mask-aws-account-id: true
      - name: Terraform init, validate and plan
        working-directory: infra/app
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false -backend-config="bucket=tream-${account_id}-tfstate"
          terraform fmt -check
          terraform validate
          terraform plan -input=false -lock-timeout=120s -out=deployment.tfplan
      - name: Guard targeted launch plan
        if: inputs.launch_safe
        run: |
          terraform -chdir=infra/app show -json deployment.tfplan > /tmp/tream-launch-plan.json
          python3 operations/check_launch_plan.py /tmp/tream-launch-plan.json
      - name: Apply development infrastructure
        working-directory: infra/app
        run: terraform apply -input=false -lock-timeout=120s deployment.tfplan
      - name: Show volunteer site DNS records
        run: terraform -chdir=infra/app output -json site_domain_dns
      - name: Show email DNS records
        run: terraform -chdir=infra/app output -json email_dns_records
      - name: Prepare application tooling
        run: |
          python3 -m venv /tmp/tream-deploy-venv
          /tmp/tream-deploy-venv/bin/pip install 'boto3>=1.35,<2'
          npm install --prefix /tmp/tream-browser --no-audit --no-fund playwright@1.56.1
          /tmp/tream-browser/node_modules/.bin/playwright install chromium --only-shell
          /tmp/tream-browser/node_modules/.bin/playwright install --with-deps webkit
      - name: Check organizer layout before publishing
        run: |
          python3 -m http.server 8010 --directory public > /tmp/tream-layout-server.log 2>&1 &
          layout_server_pid=$!
          trap 'kill "$layout_server_pid"' EXIT
          SITE_URL=http://127.0.0.1:8010 node operations/browser_admin_layout.cjs
      - name: Seed draft schedule and publish frontend
        run: |
          export TABLE_NAME="$(terraform -chdir=infra/app output -raw table_name)"
          export API_URL="$(terraform -chdir=infra/app output -raw api_url)"
          export SITE_URL="$(terraform -chdir=infra/app output -raw site_url)"
          export ORGANIZER_POOL_ID="$(terraform -chdir=infra/app output -raw organizer_pool_id)"
          export ORGANIZER_CLIENT_ID="$(terraform -chdir=infra/app output -raw organizer_client_id)"
          web_bucket="$(terraform -chdir=infra/app output -raw web_bucket)"
          distribution="$(terraform -chdir=infra/app output -raw distribution_id)"
          if [ "$LAUNCH_SAFE" != "true" ]; then
            /tmp/tream-deploy-venv/bin/python scripts/seed_schedule.py
            /tmp/tream-deploy-venv/bin/python scripts/remove_job_types.py
            /tmp/tream-deploy-venv/bin/python scripts/backfill_contacts.py
            /tmp/tream-deploy-venv/bin/python scripts/update_unloading.py
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('public/config.js').write_text('window.TREAM_CONFIG = '+json.dumps({'apiBase':os.environ['API_URL'],'organizerPoolId':os.environ['ORGANIZER_POOL_ID'],'organizerClientId':os.environ['ORGANIZER_CLIENT_ID'],'region':'us-east-2'})+';\n')
          PY
          if [ "$LAUNCH_SAFE" = "true" ]; then
            for file in request.js app.js manage.js organizer.js organizer.css index.html manage.html organizer.html; do
              aws s3 cp "public/$file" "s3://${web_bucket}/$file" --cache-control 'max-age=60'
            done
          else
            aws s3 sync public/ "s3://${web_bucket}/" --delete --cache-control 'max-age=60'
          fi
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths '/*' --query Invalidation.Id --output text
          echo "SITE_URL=${SITE_URL}" >> "$GITHUB_ENV"
          echo "API_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "TABLE_NAME=${TABLE_NAME}" >> "$GITHUB_ENV"
          echo "ORGANIZER_POOL_ID=${ORGANIZER_POOL_ID}" >> "$GITHUB_ENV"
          echo "ORGANIZER_CLIENT_ID=${ORGANIZER_CLIENT_ID}" >> "$GITHUB_ENV"
          {
            echo '## Development deployment'
            echo "- Board: ${SITE_URL}"
            echo "- API: ${API_URL}"
            echo '- Shared development database. Transactional team-test emails are enabled; organizer broadcast sending stays disabled.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise deployed API and clean up test data
        if: ${{ !inputs.launch_safe }}
        run: /tmp/tream-deploy-venv/bin/python scripts/smoke_aws.py
      - name: Exercise organizer authorization and operations
        if: ${{ !inputs.launch_safe }}
        run: /tmp/tream-deploy-venv/bin/python scripts/smoke_admin.py
      - name: Exercise public schedule policy rendering
        run: node scripts/browser_public_rules.cjs
      - name: Exercise mobile volunteer board
        run: node scripts/browser_mobile.cjs
      - name: Verify mobile organizer layout in Chromium and WebKit
        run: node operations/browser_admin_layout.cjs
      - name: Verify crawler exclusions and branding
        run: /tmp/tream-deploy-venv/bin/python scripts/check_visibility.py
      - name: API diagnostics after a failed deployment test
        if: ${{ failure() }}
        continue-on-error: true
        run: aws logs tail /aws/lambda/tream-dev-api --since 10m --format short
