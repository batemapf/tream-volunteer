name: AWS deployment preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/aws-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      DEPLOY_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
    steps:
      - name: Check role configuration
        shell: bash
        run: |
          if [[ ! "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/tream-github-deploy$ ]]; then
            echo '::error::Set AWS_ROLE_ARN in the production environment to arn:aws:iam::ACCOUNT_ID:role/tream-github-deploy.'
            exit 1
          fi
      - name: Check OIDC identity claims
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, json, base64, urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(req) as response:
              token = json.load(response)['value']
          print('::add-mask::' + token)
          payload = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          # Decode for diagnostics only. AWS performs signature and trust validation.
          safe = {k: claims.get(k) for k in ['iss', 'aud', 'sub', 'repository', 'environment', 'ref']}
          print(json.dumps(safe, indent=2))
          expected = 'repo:batemapf@7645362/tream-volunteer@1456028757:environment:production'
          if claims.get('sub') != expected:
              print('::warning::Actual OIDC subject differs from the configured trust-policy subject.')
          PYCODE
      - name: Assume deployment role using GitHub OIDC
        id: aws
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: tream-preflight
          retry-max-attempts: 2
          mask-aws-account-id: true
      - name: Verify identity, state bucket and runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state_bucket="tream-${account_id}-tfstate"
          aws s3api head-bucket --bucket "$state_bucket"
          aws s3api get-bucket-location --bucket "$state_bucket" > /tmp/tream-location.json
          aws s3api get-bucket-versioning --bucket "$state_bucket" > /tmp/tream-versioning.json
          aws s3api get-bucket-encryption --bucket "$state_bucket" > /tmp/tream-encryption.json
          aws s3api get-public-access-block --bucket "$state_bucket" > /tmp/tream-public-access.json
          python3 - <<'PY'
          import json
          def load(name):
              with open('/tmp/tream-'+name+'.json') as f:
                  return json.load(f)
          assert load('location')['LocationConstraint'] == 'us-east-2', 'State bucket must be in us-east-2'
          assert load('versioning').get('Status') == 'Enabled', 'State bucket versioning must be enabled'
          rules = load('encryption')['ServerSideEncryptionConfiguration']['Rules']
          assert any(r['ApplyServerSideEncryptionByDefault']['SSEAlgorithm'] == 'AES256' for r in rules), 'Expected SSE-S3 state encryption; KMS needs additional key permissions'
          block = load('public-access')['PublicAccessBlockConfiguration']
          assert all(block.get(k) for k in ['BlockPublicAcls','IgnorePublicAcls','BlockPublicPolicy','RestrictPublicBuckets']), 'Enable all four state-bucket public-access blocks'
          print('State bucket region, versioning, encryption and public-access blocks verified.')
          PY
      - name: Verify runtime boundary exists
        if: ${{ !cancelled() && steps.aws.outcome == 'success' }}
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          aws iam get-policy --policy-arn "arn:aws:iam::${account_id}:policy/tream-runtime-boundary" --query 'Policy.DefaultVersionId' --output text
      - name: Read development resource status
        if: ${{ !cancelled() && steps.aws.outcome == 'success' }}
        shell: bash
        run: |
          aws dynamodb describe-table --table-name tream-dev-data --query '{Table:Table.TableStatus,Indexes:Table.GlobalSecondaryIndexes[].{Name:IndexName,Status:IndexStatus,Backfilling:Backfilling}}' --output json
          aws cognito-idp list-user-pools --max-results 60 --query 'UserPools[?Name==`tream-dev-organizers`].{Name:Name,Id:Id}' --output json
      - name: Check SES readiness
        if: ${{ !cancelled() && steps.aws.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          aws sesv2 get-account --query '{ProductionAccessEnabled:ProductionAccessEnabled,SendingEnabled:SendingEnabled,SendQuota:SendQuota}' --output json
          {
            echo '## AWS connection and SES checks'
            echo '- GitHub OIDC successfully assumed the deployment role.'
            echo '- See the individual state-bucket check result above.'
            echo '- See the individual runtime-boundary check result above.'
            echo '- SES account status is available in the workflow log.'
            echo '- Read-only checks only: no infrastructure was provisioned and no email sent.'
            echo '- Full provisioning permissions remain to be exercised against the Terraform implementation.'
          } >> "$GITHUB_STEP_SUMMARY"
